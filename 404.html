<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Giveaway Wheel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');
        body {
            background-color: #111;
            color: white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            margin-bottom: 30px;
        }
        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
            transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99); /* Smooth Spin */
        }
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ff0055;
            z-index: 10;
            filter: drop-shadow(0 0 5px #ff0055);
        }
        .controls {
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            font-family: 'Poppins', sans-serif;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .spin-btn {
            background: linear-gradient(45deg, #00ffcc, #0066ff);
            color: #111;
            box-shadow: 0 0 15px #00ffcc;
        }
        .spin-btn:hover { box-shadow: 0 0 30px #00ffcc; transform: scale(1.05); }
        .again-btn {
            background: #222;
            color: white;
            border: 2px solid #555;
        }
        .again-btn:hover { border-color: #00ffcc; }
        
        #winner-text {
            margin-top: 20px;
            font-size: 30px;
            color: #ff0055;
            text-shadow: 0 0 15px #ff0055;
            min-height: 45px;
        }
    </style>
</head>
<body>

    <h1>GIVEAWAY SPIN 🌀</h1>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="400" height="400"></canvas>
    </div>

    <div id="winner-text">Waiting for players...</div>

    <div class="controls">
        <button class="spin-btn" onclick="spinWheel()">🔥 SPIN THE WHEEL 🔥</button>
        <button class="again-btn" onclick="resetWheel()">🔄 AGAIN</button>
    </div>

    <audio id="spinSound" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
    <audio id="winSound" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinSound = document.getElementById('spinSound');
        const winSound = document.getElementById('winSound');
        
        let names = [];
        let currentDeg = 0;
        let isSpinning = false;
        const colors = ['#f39c12', '#e74c3c', '#9b59b6', '#3498db', '#1abc9c', '#e67e22', '#2ecc71', '#34495e'];

        // Auto-fetch players from Python Bot every 2 seconds
        setInterval(async () => {
            if(isSpinning) return; // Wheel ghumte waqt data update mat karo
            try {
                let res = await fetch('/get_players');
                let data = await res.json();
                
                // Only redraw if the list of names changed
                if(JSON.stringify(data.players) !== JSON.stringify(names)) {
                    names = data.players.length > 0 ? data.players : ["Waiting..."];
                    document.getElementById('winner-text').innerText = `Total Players: ${names[0] === "Waiting..." ? 0 : names.length}`;
                    drawWheel();
                }
            } catch (err) {}
        }, 2000);

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = centerX;
            const sliceAngle = (2 * Math.PI) / names.length;

            for (let i = 0; i < names.length; i++) {
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, i * sliceAngle, (i + 1) * sliceAngle);
                ctx.lineTo(centerX, centerY);
                ctx.fill();
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(i * sliceAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 20px Poppins";
                ctx.fillText(names[i], radius - 20, 10);
                ctx.restore();
            }
        }

        function spinWheel() {
            if (isSpinning || names.length === 0 || names[0] === "Waiting...") return;
            isSpinning = true;
            document.getElementById('winner-text').innerText = "Spinning... 🎲";
            
            spinSound.currentTime = 0;
            spinSound.play();

            // Random rotation (5-10 extra full spins + random slice)
            let extraSpins = Math.floor(Math.random() * 5) + 5;
            let randomDeg = Math.floor(Math.random() * 360);
            let totalRotation = currentDeg + (360 * extraSpins) + randomDeg;

            canvas.style.transform = `rotate(${totalRotation}deg)`;
            currentDeg = totalRotation;

            // Wait for animation to finish (5 seconds)
            setTimeout(() => {
                isSpinning = false;
                spinSound.pause();
                winSound.play();

                // Calculate Winner mathematically
                let actualDeg = currentDeg % 360;
                // Pointer is at TOP (270 degrees in canvas math relative to drawing)
                let adjustedDeg = (360 - actualDeg + 270) % 360; 
                let sliceDeg = 360 / names.length;
                let winnerIndex = Math.floor(adjustedDeg / sliceDeg);
                
                document.getElementById('winner-text').innerHTML = `🎉 WINNER: ${names[winnerIndex]} 🎉`;
            }, 5000);
        }

        function resetWheel() {
            if(isSpinning) return;
            document.getElementById('winner-text').innerText = "Ready!";
            // Note: Does not clear names. Terminal se "gwy start" karne par names clear honge.
        }

        // Draw initially
        drawWheel();
    </script>
</body>
</html>
